<!DOCTYPE html>
<html lang="en">
<head>

	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<title> Message</title>
    <style>
*{
	margin: 0;
	padding: 0;
	font-family: 'Roboto Condensed', sans-serif;
}



/* banner */

#banner-container{
	background-color: #074241;
	color: #fff !important;
	padding-top: 80px;
	padding-bottom: 80px;
}
#banner-row img{
	max-width: 65%;
	height: auto;
	display: block;
	padding-left: 30px;
}

#banner-row a{
	background-color: #fff !important;
	color: #000 !important;
	border: none;
	margin-left: 20px;
	margin-top: 20px; 
}

#banner-row h3,p{
	padding-left: 20px;
	padding-top: 20px;
	text-align: center;
}
#banner-col{
	padding-left: 20px;
}
/* service */
#service{
	padding-top: 20px;
	padding-bottom: 20px;
}

#service h1{
	padding-bottom: 70px;
}
        ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        }

        ul, li {
            font-weight: 600;
            font-family: "EB Garamond", serif;
            font-optical-sizing: auto;
            font-style: normal;
        }


/* footer */
.mb-3{
	padding-top: 10px;
}

@media only screen and (max-width:960px)
{
	.navbar-brand{
		padding-left:0;
	}
}
@media only screen and (max-width:760px)
{
	#banner-row img{
		padding-top:20px;
	}
	.social-col{
		width: 33%;
	}
}
hr {
    border-top: 5px double #8c8b8b;
}
    </style>
</head>

<body>
	


		<!-- services -->
		<section id="service">
			<div class="container-fluid" id="service-container">
				
				<ul>
					<li>
						From : {{email}}
					</li>
					<li>
						Name : {{name}}
					</li>
				</ul>
				<hr>
				
				<div class="row" id="banner-row" >
					<div class="col-md-10" id="service-col1" style="text-align: left;">
						<p style="text-align: left;">
							{{message}}
						</p>
					</div>
				</div>
			</div>
		</section>
		<hr/>  
							<div class="footer" style="clear: both; padding-top: 24px; text-align: center; width: 100%;">
								<table role="presentation" border="0" cellpadding="0" cellspacing="0"
									style="border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%;" width="100%">

										<td class="content-block"
											style="font-family: Helvetica, sans-serif; vertical-align: top; color: #9a9ea6; font-size: 16px; text-align: center;"

											<span class="apple-link" style="color: #9a9ea6; font-size: 16px; text-align: center;">Chakrabarty Lab,
												S.N.B.N.C.B.S</span>
											<br> <a href="https://www.teamsuman.org"
												style="text-decoration: underline; color: #9a9ea6; font-size: 16px; text-align: center;">Visit
												website!</a>.
										</td>
									</tr>
									<tr>
										<td class="content-block powered-by"
											style="font-family: Helvetica, sans-serif; vertical-align: top; color: #9a9ea6; font-size: 16px; text-align: center;"
